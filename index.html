<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艾特阅读</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #171c1b;
      --paper-soft: #202826;
      --ink: #edf5f1;
      --muted: #91a39c;
      --accent: #65c4b8;
      --accent-soft: rgba(101, 196, 184, .14);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 42%, var(--accent-soft), transparent 38%),
        linear-gradient(145deg, var(--paper-soft), var(--paper) 64%);
      font-family: "Songti SC", "Noto Serif CJK SC", STSong, serif;
      user-select: none;
    }
    main {
      width: min(360px, calc(100vw - 64px));
      display: grid;
      justify-items: center;
      text-align: center;
      animation: arrive .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: var(--accent);
      -webkit-mask: url('/atrd-logo.svg') center / contain no-repeat;
      mask: url('/atrd-logo.svg') center / contain no-repeat;
      filter: drop-shadow(0 12px 26px rgba(101, 196, 184, .18));
      animation: breathe 2.2s ease-in-out infinite;
    }
    h1 {
      margin: 25px 0 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: .2em;
      text-indent: .2em;
    }
    .status {
      margin: 13px 0 0;
      color: var(--muted);
      font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: .08em;
    }
    .progress {
      width: 132px;
      height: 1px;
      margin-top: 24px;
      overflow: hidden;
      background: rgba(237, 245, 241, .1);
    }
    .progress::after {
      content: "";
      display: block;
      width: 48%;
      height: 100%;
      background: var(--accent);
      animation: travel 1.5s ease-in-out infinite;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      50% { transform: scale(.95); opacity: .72; }
    }
    @keyframes travel {
      from { transform: translateX(-105%); }
      to { transform: translateX(215%); }
    }
    @media (prefers-reduced-motion: reduce) {
      main, .logo, .progress::after { animation: none; }
      .progress::after { width: 100%; opacity: .55; }
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="logo" role="img" aria-label="艾特阅读标志"></div>
    <h1>艾特阅读</h1>
    <p class="status">正在准备阅读空间</p>
    <div class="progress" aria-hidden="true"></div>
  </main>
</body>
</html>
